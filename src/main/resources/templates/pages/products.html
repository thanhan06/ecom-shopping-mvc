<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <title layout:fragment="title" th:text="#{products.title}"></title>
        <th:block layout:fragment="page-css">
            <link rel="stylesheet" th:href="@{/css/products.css}">
        </th:block>
    </head>
    <body>
        <div layout:fragment="content">
            <div style="margin-bottom: 20px;">
                <span style="font-weight: bold;">Ngôn ngữ / Language: </span>
                <a th:href="@{''(lang=vi)}">Tiếng Việt</a> |
                <a th:href="@{''(lang=en)}">English</a>
            </div>
            <p>Xin chào, <span sec:authentication="name"></span>!</p>

            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit" class="btn btn-danger">Đăng xuất</button>
            </form>

            <div sec:authorize="hasRole('ADMIN')">
                <span style="color: red; font-weight: bold;">Bạn có quyền
                    ADMIN</span>
            </div>
            <form th:action="@{/products}" method="get"
                class="d-flex gap-2 mb-4">

                <!-- Nhập tên sản phẩm -->
                <input type="text" name="productName" th:value="${productName}"
                    class="form-control" placeholder="Tên sản phẩm...">

                <!-- Chọn Loại sản phẩm bằng Dropdown -->
                <select name="productTypeId" class="form-control">
                    <option value>-- Tất cả danh mục --</option>

                    <!-- Vòng lặp vẽ ra các option -->
                    <option th:each="type : ${listProductTypes}"
                        th:value="${type.productTypeId}"
                        th:text="${type.productTypeName}"
                        th:selected="${type.productTypeId == productTypeId}">
                        <!-- Lệnh th:selected giúp "giữ nguyên" mục khách vừa chọn sau khi bấm Tìm kiếm -->
                    </option>
                </select>

                <!-- Nhập mô tả -->
                <input type="text" name="description" th:value="${description}"
                    class="form-control" placeholder="Mô tả...">

                <button type="submit" class="btn btn-primary">Tìm kiếm</button>
            </form>
            <h1>Product List</h1>

            <!-- Vùng hiển thị thông báo lỗi/thành công từ FlashAttributes -->
            <div id="messageContainer" style="margin-bottom: 20px;">
                <ul id="errorList" style="list-style-type: none; padding: 0;">
                    <li th:each="error : ${errorList}" th:text="${error}"
                        style="color: red; font-weight: bold;"></li>
                </ul>
                <p th:if="${successMessage}" th:text="${successMessage}"
                    style="color: green; font-weight: bold;"></p>
            </div>
            <!-- Form Đặt hàng hàng loạt (Bulk Order) -->
            <form id="bulkOrderForm" th:action="@{/order/checkout}"
                method="post">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Price</th>
                            <th>Product Type</th>
                            <th>Quantity</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td th:text="${product.productId}"></td>
                            <td th:text="${product.productName}"></td>
                            <td th:text="${product.description}"></td>
                            <td th:text="${product.price}"></td>
                            <td th:text="${product.productTypeName}"></td>
                            <td>
                                <!-- Mảng Product IDs ẩn -->
                                <input type="hidden" name="productIds"
                                    th:value="${product.productId}">

                                <!-- Mảng Số lượng (để trống, không set value mặc định) -->
                                <input type="number" name="quantities"
                                    th:id="'quantity_' + ${product.productId}"
                                    min="0">
                            </td>
                        </tr>
                    </tbody>
                </table>
                <br>
                <button type="submit" class="btn btn-primary">Tạo đơn
                    hàng</button>
            </form>
            <!-- Phần phân trang -->
            <div th:if="${totalPages} >1">
                <nav>
                    <ul class="pagination">
                        <!-- Các nút Số trang (1, 2, 3...) -->
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(1, totalPages)}"
                            th:classappend="${currentPage == i} ? 'active'">
                            <a class="page-link"
                                th:href="@{/products(pageNo=${i}, productName=${productName}, productTypeId=${productTypeId}, description=${description})}">
                                [[${i}]]
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <th:block layout:fragment="page-js">
            <script th:src="@{/js/products.js}"></script>
        </th:block>
    </body>
</html>
