<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <title layout:fragment="title" th:text="#{products.title}"></title>
        <th:block layout:fragment="page-css">
            <link rel="stylesheet" th:href="@{/css/products.css}">
        </th:block>
    </head>
    <body>
        <div layout:fragment="content" class="container-fluid page-main">
            <h1>Product List</h1>
            <form th:action="@{/products}" method="get"
                class="row g-4 align-items-center">

                <div class="col-3 align-items-center">
                    <input type="text" name="productName"
                        th:value="${productName}"
                        class="form-control"
                        placeholder="Tên sản phẩm...">
                </div>

                <div class="col-3">
                    <select name="productTypeId"
                        class="form-select" data-size="4">
                        <option value>-- Tất cả danh mục --</option>
                        <option th:each="type : ${listProductTypes}"
                            th:value="${type.productTypeId}"
                            th:text="${type.productTypeName}"
                            th:selected="${type.productTypeId == productTypeId}">
                        </option>
                    </select>
                </div>

                <div class="col-4">
                    <input type="text" name="description"
                        th:value="${description}"
                        class="form-control"
                        placeholder="Mô tả...">
                </div>

                <div class="col-1">
                    <button type="submit" class="btn btn-primary">
                        Tìm kiếm
                    </button>
                </div>

                <div class="col-1">
                    <a th:href="@{/products}"
                        class="btn btn-outline-secondary">
                        Đặt lại
                    </a>
                </div>
            </form>
            <!-- Vùng hiển thị thông báo lỗi/thành công từ FlashAttributes -->
            <!-- <div id="messageContainer" style="margin-bottom: 20px;">
                <ul id="errorList" style="list-style-type: none; padding: 0;">
                    <li th:each="error : ${errorList}" th:text="${error}"
                        style="color: red; font-weight: bold;"></li>
                </ul>
                <p th:if="${successMessage}" th:text="${successMessage}"
                    style="color: green; font-weight: bold;"></p>
            </div> -->
            <!-- Toast thông báo lỗi -->
            <div th:replace="~{fragments/notification :: notification}"></div>
            <!-- Form Đặt hàng hàng loạt (Bulk Order) -->
            <form id="bulkOrderForm" th:action="@{/order/checkout}"
                method="post">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Price</th>
                                <th>Product Type</th>
                                <th>Quantity</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product : ${products}">
                                <td th:text="${product.productId}"></td>
                                <td th:text="${product.productName}"></td>
                                <td th:text="${product.description}"></td>
                                <td th:text="${product.price}"></td>
                                <td th:text="${product.productTypeName}"></td>
                                <td>
                                    <!-- Mảng Product IDs ẩn -->
                                    <input type="hidden" name="productIds"
                                        th:value="${product.productId}">

                                    <!-- Mảng Số lượng (để trống, không set value mặc định) -->
                                    <input type="number" name="quantities"
                                        th:id="'quantity_' + ${product.productId}"
                                        min="0">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <br>
                <button type="submit" class="btn btn-primary">Tạo đơn
                    hàng</button>
            </form>
            <!-- GỌI THANH PHÂN TRANG -->
            <!-- Cú pháp: ~{thư_mục/tên_file :: tên_fragment(tham_số)} -->
            <div
                th:replace="~{fragments/pagination :: paginationBar('/products')}">
            </div>
        </div>

        <th:block layout:fragment="page-js">
            <script th:src="@{/js/products.js}"></script>
        </th:block>
    </body>
</html>
