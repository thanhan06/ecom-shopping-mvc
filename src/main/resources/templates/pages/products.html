<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title" th:text="#{products.title}"></title>
    <th:block layout:fragment="page-css">
        <link rel="stylesheet" th:href="@{/css/login.css}">
    </th:block>
</head>
<body>
    <div layout:fragment="content">
        <div style="margin-bottom: 20px;">
            <span style="font-weight: bold;">Ngôn ngữ / Language: </span>
            <a th:href="@{''(lang=vi)}">Tiếng Việt</a> |
            <a th:href="@{''(lang=en)}">English</a>
        </div>
        <h1>Product List</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Product Type</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.productId}"></td>
                    <td th:text="${product.productName}"></td>
                    <td th:text="${product.description}"></td>
                    <td th:text="${product.price}"></td>
                    <td th:text="${product.productTypeName}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    <th:block layout:fragment="page-js">
        <script th:src="@{/js/login.js}"></script>
    </th:block>
</body>
</html>
