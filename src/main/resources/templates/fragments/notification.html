<div th:fragment="notification">

    <div class="toast-container position-fixed top-0 end-0 p-3">

        <!-- Error Toast -->
        <div id="errorToast"
            class="toast text-bg-danger border-0"
            role="alert">

            <div class="d-flex">
                <div class="toast-body">
                    <ul id="errorList" class="mb-0 ps-3"></ul>
                </div>

                <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast">
                </button>
            </div>
        </div>

        <!-- Success Toast -->
        <div id="successToast"
            class="toast text-bg-success border-0"
            role="alert">

            <div class="d-flex">
                <div class="toast-body"></div>

                <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast">
                </button>
            </div>
        </div>

    </div>
</div>
