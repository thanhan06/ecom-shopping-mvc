<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- KHỐI PHÂN TRANG REUSABLE -->
    <!-- Đặt tên fragment là 'paginationBar', nhận vào 1 biến là 'baseUrl' (ví dụ: '/products') -->
    <div th:fragment="paginationBar(baseUrl)" th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-4 mb-5">
        
        <div class="text-muted">
            Trang <strong th:text="${currentPage}"></strong> / <strong th:text="${totalPages}"></strong> 
            (Tổng số: <strong th:text="${totalItems}"></strong> bản ghi)
        </div>

        <nav aria-label="Page navigation">
            <ul class="pagination mb-0">
                
                <!-- Về đầu -->
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a th:unless="${currentPage == 1}" class="page-link"
                       th:href="@{${baseUrl}(pageNo=1, productName=${productName}, productTypeId=${productTypeId}, description=${description})}">
                       &laquo; Về đầu
                    </a>
                    <span th:if="${currentPage == 1}" class="page-link">&laquo; Về đầu</span>
                </li>

                <!-- Trang trước -->
                <li class="page-item" th:classappend="${currentPage <= 1} ? 'disabled'">
                    <a th:unless="${currentPage <= 1}" class="page-link"
                       th:href="@{${baseUrl}(pageNo=${currentPage - 1}, productName=${productName}, productTypeId=${productTypeId}, description=${description})}">
                       &lsaquo; Trang trước
                    </a>
                    <span th:if="${currentPage <= 1}" class="page-link">&lsaquo; Trang trước</span>
                </li>

                <!-- Các trang ở giữa -->
                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i} ? 'active'">
                    <a th:unless="${currentPage == i}" class="page-link"
                       th:href="@{${baseUrl}(pageNo=${i}, productName=${productName}, productTypeId=${productTypeId}, description=${description})}">
                       [[${i}]]
                    </a>
                    <span th:if="${currentPage == i}" class="page-link text-white">[[${i}]]</span>
                </li>

                <!-- Trang sau -->
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a th:unless="${currentPage == totalPages}" class="page-link"
                       th:href="@{${baseUrl}(pageNo=${currentPage + 1}, productName=${productName}, productTypeId=${productTypeId}, description=${description})}">
                       Trang sau &rsaquo;
                    </a>
                    <span th:if="${currentPage == totalPages}" class="page-link">Trang sau &rsaquo;</span>
                </li>

                <!-- Về cuối -->
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a th:unless="${currentPage == totalPages}" class="page-link"
                       th:href="@{${baseUrl}(pageNo=${totalPages}, productName=${productName}, productTypeId=${productTypeId}, description=${description})}">
                       Về cuối &raquo;
                    </a>
                    <span th:if="${currentPage == totalPages}" class="page-link">Về cuối &raquo;</span>
                </li>
                
            </ul>
        </nav>
    </div>

</body>
</html>
