<!-- fragments/header.html -->
<header th:fragment="header(currentUrl)" class ="page-header">
    <nav class="d-flex justify-content-end align-items-center my-2 gap-2">
        <a class="d-flex align-items-center"
           th:href="@{/}"
           th:classappend="${currentUrl == '/' ? 'active' : ''}">
            Trang chủ
        </a>

        <p class="mb-0">
            Xin chào, <span sec:authentication="name"></span>!
        </p>

        <form class="me-2" th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-danger">
                Đăng xuất
            </button>
        </form>
    </nav>
</header>
