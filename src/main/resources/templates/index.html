<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title" th:text="#{home.title}"></title>
    <th:block layout:fragment="page-css">
        <link rel="stylesheet" th:href="@{/css/login.css}">
    </th:block>
</head>
<body>
    <div layout:fragment="content">
        <div style="margin-bottom: 20px;">
            <span style="font-weight: bold;">Ngôn ngữ / Language: </span>
            <a th:href="@{''(lang=vi)}">Tiếng Việt</a> |
            <a th:href="@{''(lang=en)}">English</a>
        </div>
        <h1>Welcome to the Shopping Application</h1>
        <p>This is the home page of the shopping application.</p>
    </div>
    <th:block layout:fragment="page-js">
        <script th:src="@{/js/login.js}"></script>
    </th:block>
</body>
</html>
