<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <!-- Truyền động tiêu đề đa ngôn ngữ lên Layout chung -->
    <title layout:fragment="title" th:text="#{login.title}"></title>

    <!-- Điểm neo 1: Chèn file CSS đặc thù của trang Login -->
    <th:block layout:fragment="page-css">
        <link rel="stylesheet" th:href="@{/css/login.css}">
    </th:block>
</head>
<body>
    
    <!-- Điểm neo 2: Đổ toàn bộ nội dung Form vào <main> của Layout -->
    <div layout:fragment="content">
        
        <!-- Nút chọn ngôn ngữ -->
        <div style="margin-bottom: 20px;">
            <span style="font-weight: bold;">Ngôn ngữ / Language: </span>
            <a th:href="@{''(lang=vi)}">Tiếng Việt</a> | 
            <a th:href="@{''(lang=en)}">English</a>
        </div>

        <!-- Form đăng nhập bọc đối tượng DTO và dùng đa ngôn ngữ -->
        <form th:action="@{/login}" th:object="${authenticationReq}" method="post">
            <div>
                <label for="username" th:text="#{login.username}"></label>
                <input type="text" id="username" th:field="*{username}" required>
            </div>
            <br>
            <div>
                <label for="password" th:text="#{login.password}"></label>
                <input type="password" id="password" th:field="*{password}" required>
            </div>
            <br>
            <button type="submit" th:text="#{login.button}"></button>
        </form>
        
        <!-- Hiển thị lỗi nếu sai tài khoản/mật khẩu -->
        <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red; font-style: italic;"></p>
        
    </div>

    <!-- Điểm neo 3: Chèn file JS xử lý (ví dụ: ẩn/hiện mật khẩu, validate form) -->
    <th:block layout:fragment="page-js">
        <script th:src="@{/js/login.js}"></script>
    </th:block>

</body>
</html>
