<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- 1. SEO động: Nếu Controller không truyền 'pageDesc', dùng câu mặc định -->
        <meta name="description"
            th:content="${pageDesc ?: 'Hệ thống thương mại điện tử EcomMVC'}">
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <title layout:fragment="title">Tiêu đề mặc định</title>
        <!-- Chỉ cần import Bootstrap 1 lần ở đây -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Cần có jQuery và Bootstrap trước -->
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta2/css/bootstrap-select.min.css">
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-select/1.14.0-beta2/js/bootstrap-select.min.js"></script>
        <!-- CSS dùng chung (Bootstrap, Tailwind, font...) -->
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <script th:src="@{/js/notification.js}"></script>

        <!-- 2. Điểm neo để các trang con tự nhúng CSS đặc thù -->
        <th:block layout:fragment="page-css"></th:block>
    </head>
    <body>
        <!-- 3. Bơm URL hiện tại vào Header để xử lý logic Active Menu -->
        <!-- Đổi #httpServletRequest.requestURI thành #ctx.springRequestContext.requestUri -->
        <div class="page-layout">
            <header
                th:replace="~{fragments/header :: header(currentUrl=${currentUrl})}"></header>

            <!-- Khu vực đổ dữ liệu của trang con -->
            <main layout:fragment="content">
            </main>

            <footer th:replace="~{fragments/footer :: footer}"></footer>

            <!-- JS dùng chung (JQuery, Bootstrap JS...) -->
            <script th:src="@{/js/main.js}"></script>

            <!-- Điểm neo để các trang con tự nhúng JS đặc thù -->
            <th:block layout:fragment="page-js"></th:block>
        </div>
    </body>
</html>
