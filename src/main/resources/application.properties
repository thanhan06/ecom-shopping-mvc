spring.application.name=shopping
# Thông tin kết nối PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ecom
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=ecom
spring.datasource.password=ecom123

# Cấu hình Hibernate (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Cấu hình cổng chạy ứng dụng
server.port=8080

# Cấu hình i18n
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8